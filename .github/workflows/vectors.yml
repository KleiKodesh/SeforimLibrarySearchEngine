# Full-library semantic search latency on GitHub Actions (manual, issue #18): semantic search
# like Otzaria, an exact scan over Otzaria's own vector release (no import, nothing built from
# it), for BOTH codecs: the QA491 i8 release and a rot192-i8i4 release. Per codec: download and
# expand the release, open it read-only with the C# demo, map the full seforim.db's books, run
# queries with Otzaria's Meivin query model at Otzaria's thread default (half the cores, at most
# 8) and print own-line rank, mean / p95 search latency and the peak working set. The mapping
# runs Otzaria's text check on every book (rows rebuilt, keys recomputed): its time and the
# verified / moved / unverified counts are printed too. Long runs go
# here, not on a user PC.
name: vectors

on:
  workflow_dispatch:
    inputs:
      i8_db_tag:
        description: seforim.db release of the i8 vector release (library version must match)
        default: v37-20261105163520
      i8_vectors_tag:
        description: Otzaria/SeforimLibrary vector release, i8 codec
        default: vectors-qa491-v37-20261105163520
      rot_db_tag:
        description: seforim.db release of the rot vector release
        default: v38-20261112163847
      rot_vectors_tag:
        description: Otzaria/SeforimLibrary vector release, rot192-i8i4 codec
        default: vectors-qa491-windows-v38-20261112163847
      model_tag:
        description: Otzaria/otzaria-semantic-search model release (query model, family QA491)
        default: model-meivin-qa491-int8-v1
      queries:
        description: random lines used as queries
        default: "40"

env:
  OUT: C:/bench
  PYTHONUTF8: "1"
  GH_TOKEN: ${{ github.token }}

jobs:
  # every seforim.db the matrix uses, downloaded once and cached (fullrun-setup restores it)
  db:
    strategy:
      matrix:
        db_tag: ["${{ inputs.i8_db_tag }}", "${{ inputs.rot_db_tag }}"]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.14" }
      - id: cache
        uses: actions/cache@v4
        with:
          path: C:/bench/data/seforim-schema7.db.zst
          key: seforim-db-${{ matrix.db_tag }}
      - name: download seforim.db
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          printf 'OUT_DIR=/c/bench\nDB_TAG=%s\n' "${{ matrix.db_tag }}" > tools/bench/bench.local.env
          tools/bench/run-all.sh --steps db
          rm -f /c/bench/data/seforim.db

  latency:
    needs: db
    strategy:
      fail-fast: false
      matrix:
        codec: [i8, rot]
    runs-on: windows-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - id: tags
        shell: bash
        run: |
          if [ "${{ matrix.codec }}" = i8 ]; then
            echo "db=${{ inputs.i8_db_tag }}" >> "$GITHUB_OUTPUT"; echo "vectors=${{ inputs.i8_vectors_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "db=${{ inputs.rot_db_tag }}" >> "$GITHUB_OUTPUT"; echo "vectors=${{ inputs.rot_vectors_tag }}" >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/fullrun-setup
        with: { db_tag: "${{ steps.tags.outputs.db }}" }
      - name: runner
        shell: bash
        run: |
          nproc; wmic computersystem get TotalPhysicalMemory 2>/dev/null || true; df -h /c /d | cat
      - name: tools + full positions index (for --hybrid)
        shell: bash
        run: |
          printf 'OUT_DIR=/c/bench\nDB_TAG=%s\nTOOLS="engine demo"\nINDEXES="pos"\n' "${{ steps.tags.outputs.db }}" > tools/bench/bench.local.env
          set -o pipefail
          mkdir -p C:/bench/logs
          tools/bench/run-all.sh --steps detect,db,build-tools,build-indexes 2>&1 | tee C:/bench/logs/build.log
      - name: download + expand the vector release, download the query model
        shell: bash
        run: |
          # C: is small on hosted runners: the release lives on D:
          mkdir -p D:/vectors C:/bench/model
          t0=$(date +%s)
          gh release download "${{ steps.tags.outputs.vectors }}" -R Otzaria/SeforimLibrary -D D:/vectors -p "*base.oxv.zst" -p "*base.manifest.json"
          echo "download: $(( $(date +%s) - t0 )) s"
          ls -l D:/vectors
          zst=$(ls D:/vectors/*base.oxv.zst | head -1)
          t0=$(date +%s)
          python -I -c "import sys,shutil; from compression import zstd; shutil.copyfileobj(zstd.open(sys.argv[1]), open(sys.argv[2],'wb'), 1<<24)" "$zst" D:/vectors/base.oxv
          test -s D:/vectors/base.oxv
          rm -f "$zst"
          echo "expand: $(( $(date +%s) - t0 )) s"; ls -l D:/vectors
          gh release download "${{ inputs.model_tag }}" -R Otzaria/otzaria-semantic-search -D C:/bench/model -p query.int8.onnx -p tokenizer.json -p model.json -p INFERENCE_CONTRACT.json
          ls -l C:/bench/model
      - name: latency (Otzaria's exact scan, Meivin query model)
        shell: bash
        run: |
          set -o pipefail
          demo=csharp/SeforimSearch.Demo/bin/Release/net10.0/SeforimSearch.Demo.exe
          # the release's own chunking identity (its manifest), not the query model's: the text check keys
          ci=$(python -I -c "import json,glob;print(json.load(open(glob.glob('D:/vectors/*base.manifest.json')[0]))['identity']['model']['chunking_identity'])")
          echo "chunking identity $ci"
          lines=$(python -I -c "import sqlite3;c=sqlite3.connect('file:C:/bench/data/seforim.db?mode=ro',uri=True);print(','.join(str(r[0]) for r in c.execute('select id from line order by (id * 2654435761) % 4294967296 limit ${{ inputs.queries }}')))")
          echo "$lines" | cut -d, -f1 > C:/bench/logs/first-line.txt
          $demo semantic-search C:/bench/indexes/ours-pos --vectors D:/vectors/base.oxv --db C:/bench/data/seforim.db --model C:/bench/model --chunking-identity $ci --lines "$lines" --k 10 --repeat 2 2>&1 | sed 's/[^ -~]/?/g' | tee C:/bench/logs/latency-${{ matrix.codec }}.log
          echo "exit ${PIPESTATUS[0]}"
      - name: text check per book (books with the most unverified records)
        if: always()
        shell: bash
        run: |
          set -o pipefail
          demo=csharp/SeforimSearch.Demo/bin/Release/net10.0/SeforimSearch.Demo.exe
          ci=$(python -I -c "import json,glob;print(json.load(open(glob.glob('D:/vectors/*base.manifest.json')[0]))['identity']['model']['chunking_identity'])")
          $demo semantic-verify D:/verify-index --vectors D:/vectors/base.oxv --db C:/bench/data/seforim.db --chunking-identity $ci --report 40 2>&1 | sed 's/[^ -~]/?/g' | tee C:/bench/logs/verify-${{ matrix.codec }}.log
          echo "exit ${PIPESTATUS[0]}"
      - name: hybrid sample
        if: always()
        shell: bash
        run: |
          demo=csharp/SeforimSearch.Demo/bin/Release/net10.0/SeforimSearch.Demo.exe
          $demo semantic-search C:/bench/indexes/ours-pos --vectors D:/vectors/base.oxv --db C:/bench/data/seforim.db --model C:/bench/model --chunking-identity $(python -I -c "import json,glob;print(json.load(open(glob.glob('D:/vectors/*base.manifest.json')[0]))['identity']['model']['chunking_identity'])") --line $(cat C:/bench/logs/first-line.txt) --k 5 --hybrid 2>&1 | sed 's/[^ -~]/?/g' | tail -40
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vectors-logs-${{ matrix.codec }}
          path: C:/bench/logs
          if-no-files-found: ignore
