name: seforim_search
description: Dart binding (dart:ffi) for the seforim_search_native Hebrew full-text engine.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  ffi: ^2.1.0
  # Native Assets build hook (hook/build.dart), as package:sqlite3 v3.
  hooks: ^2.2.0
  code_assets: ^2.1.0
  crypto: ^3.0.6

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0

# Developing this package inside the repository: build the native library
# from the workspace with cargo. Apps set their own source in THEIR root
# pubspec (default prebuilt download; see README "Dart package").
hooks:
  user_defines:
    seforim_search:
      source: cargo
