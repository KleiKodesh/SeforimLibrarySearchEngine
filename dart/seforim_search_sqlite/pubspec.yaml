name: seforim_search_sqlite
description: The ready-made seforim.db (SQLite) data source and lexical.db reader for package:seforim_search.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  ffi: ^2.1.0
  seforim_search:
    path: ../seforim_search
  sqlite3: ^3.0.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0

# Developing inside the repository: the engine's native library from cargo
# (see seforim_search's pubspec).
hooks:
  user_defines:
    seforim_search:
      source: cargo
