[package]
name = "seforim-vectors"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Semantic search over Otzaria's vector set (.oxv segments), read-only: Otzaria's exact integer scan, keyed to the host's line ids. No model runs here."
license = "MIT"

[dependencies]
memmap2 = "0.9"
crc32fast = "1.3.2"
sha2 = "0.10"
zstd = { version = "0.14", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
