[package]
name = "seforimdb-search"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Seforim-DB specific layer: index builder from seforim.db, catalog-order searcher with FtsLib-style snippets. Everything that knows the seforim database lives here."
license = "MIT"

[dependencies]
tantivy = { path = "../tantivy" }
hebrew-fts = { path = "../hebrew-fts" }
rusqlite = { version = "0.32", features = ["bundled"] }
zstd = "0.13"
zstd-safe = "7"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
