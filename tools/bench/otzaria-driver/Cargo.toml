[package]
name = "otzaria-driver"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone workspace: not a member of the repo's workspace, so normal engine builds
# never compile Otzaria's engine. Built by tools/bench/run-all.sh (step build-tools).
[workspace]

[dependencies]
# Otzaria's search engine, unmodified, pinned to commit 5babbce (7.0.1 + 38, the Otzaria app pin; fetched by cargo).
search_engine = { git = "https://github.com/Otzaria/otzaria_search_engine", rev = "5babbce643d69cb20e2e9d4592b6ece120f2723d", default-features = false, features = ["sqlite-bundled"] }
# Same version/features as the Otzaria crate (it does not re-export rusqlite); the
# bundled SQLite comes through its `sqlite-bundled` feature (rusqlite/bundled).
rusqlite = { version = "0.32", default-features = false }
serde_json = "1.0.150"

# [patch] only applies at the root of a build, so the Otzaria crate's own patches are
# repeated here, or the driver would build a different tantivy / tantivy-fst than the
# app. tantivy-fst = the copy vendored in the same commit (rust/vendor/tantivy-fst).
[patch.crates-io]
tantivy-fst = { git = "https://github.com/Otzaria/otzaria_search_engine", rev = "5babbce643d69cb20e2e9d4592b6ece120f2723d" }
tantivy = { git = "https://github.com/Otzaria/tantivy", rev = "130b2682807d2a609d09ba432ba4d0ccc8faf7ed" }

[profile.release]
lto = "thin"
